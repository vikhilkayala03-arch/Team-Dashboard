<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Menu Scanner | Vicky Academy</title>
<link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/responsive.css"><link rel="stylesheet" href="../css/animations.css"></head>
<body data-root="../">

<section class="page-head"><div class="wrap"><span class="tag">AI food technology</span><h1>AI Menu <span class="accent">Scanner</span></h1><p class="sub">Type or paste one dish per line. Get its meaning, ingredients, allergen warnings and story.</p></div></section>
<section style="padding-top:30px"><div class="wrap" style="max-width:820px"><label for="photo"><b>📷 Menu photo (optional)</b></label><input type="file" id="photo" accept="image/*" style="margin:8px 0"><div id="prev"></div>
<label for="menu" style="display:block;margin-top:18px"><b>Dish names</b></label><textarea id="menu" placeholder="Tonkotsu Ramen&#10;Pad Thai&#10;Spaghetti Carbonara"></textarea>
<div class="row"><button class="btn" id="scan">Scan menu (+10 XP)</button><button class="btn ghost" id="sample">Try a sample menu</button></div><div class="res" id="out"></div>
<p class="sub" style="font-size:.9rem;margin-top:24px">Allergen notes are a guide only. Always confirm with the restaurant.</p></div></section>
<script src="../js/data.js"></script><script src="../js/app.js"></script><script src="../js/profile.js"></script><script src="../js/scanner.js"></script>
</body></html>
